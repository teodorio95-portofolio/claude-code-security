[project]
name = "claude-code-security"
version = "0.1.0"
description = "A Claude Code security plugin: PreToolUse hooks (block destructive commands, egress allowlist, secret-scan on write), a restricted security-reviewer subagent, and /security-review + /threat-model commands."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# The hooks are stdlib-only (they run as plain `python3` commands inside Claude
# Code, with no venv). This project exists only to run the test suite.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
